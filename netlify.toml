[build]
# Build Next.js with Prisma migrations
# First generates Prisma client, then builds Next.js, then runs database migrations
command = "npx prisma generate && npm run build && npx prisma migrate deploy"
publish = ".next"

[build.environment]
NODE_VERSION = "18"
NPM_VERSION = "9"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[plugins]]
package = "@netlify/plugin-nextjs"
